<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Monitor</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Solar">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 12px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f59e0b;
    }

    header .updated {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    button#refresh {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    button#refresh:active { background: #334155; }

    /* Status karty */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }

    .card .icon { font-size: 1.4rem; }
    .card .val  { font-size: 1.1rem; font-weight: 700; margin: 2px 0; }
    .card .lbl  { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; }

    .card.battery  { border-top: 2px solid #22c55e; }
    .card.prod     { border-top: 2px solid #f59e0b; }
    .card.load     { border-top: 2px solid #60a5fa; }
    .card.grid-exp { border-top: 2px solid #f87171; }
    .card.grid-imp { border-top: 2px solid #a78bfa; }
    .card.price    { border-top: 2px solid #34d399; }

    .card.price.cheap { border-top-color: #f59e0b; background: #1c2a1a; }

    /* Řádek sítě + ceny pod kartami */
    .status-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .status-row .card { flex: 1; }

    /* Tabulka */
    .section-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      margin-top: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      text-align: left;
      color: #64748b;
      font-weight: 500;
      padding: 4px 6px;
      border-bottom: 1px solid #1e293b;
    }

    td {
      padding: 5px 6px;
      border-bottom: 1px solid #1e293b;
    }

    tr.current-hour {
      background: #1e3a2f;
    }

    tr.current-hour td { font-weight: 600; }

    td.cheap { color: #f59e0b; font-weight: 600; }

    .cloud-icon { font-size: 0.9rem; }

    #error {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      color: #fca5a5;
      display: none;
    }

    .spinner {
      text-align: center;
      padding: 40px;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>☀️ Solar Monitor</h1>
    <div class="updated" id="updated">Načítám...</div>
  </div>
  <button id="refresh" onclick="loadData()">🔄 Obnovit</button>
</header>

<div id="error">Nepodařilo se načíst data. Zkus to znovu.</div>
<div id="content" class="spinner">Načítám data…</div>

<script>
const PRICE_THRESHOLD = 1.0;

function cloudIcon(pct) {
  if (pct == null) return '?';
  if (pct < 20) return '☀️';
  if (pct < 50) return '🌤️';
  if (pct < 80) return '⛅';
  return '☁️';
}

function meterLabel(kw) {
  if (kw == null) return { label: 'Síť', icon: '🔌', cls: '' };
  if (kw > 0.1)  return { label: `+${kw.toFixed(2)} kW → síť`, icon: '🔌', cls: 'grid-exp' };
  if (kw < -0.1) return { label: `${Math.abs(kw).toFixed(2)} kW ← síť`, icon: '🔌', cls: 'grid-imp' };
  return { label: '0 kW (vyrovnaný)', icon: '🔌', cls: '' };
}

function fmt(dt) {
  const d = new Date(dt);
  return d.toLocaleDateString('cs-CZ') + ' ' + d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
}

function renderCards(solar, currentPrice) {
  const s = solar || {};
  const meter = meterLabel(s.meter_kw);
  const priceClass = currentPrice != null && currentPrice < PRICE_THRESHOLD ? 'cheap' : '';

  return `
    <div class="cards">
      <div class="card battery">
        <div class="icon">🔋</div>
        <div class="val">${s.battery_pct != null ? s.battery_pct.toFixed(0) + ' %' : '–'}</div>
        <div class="lbl">Baterie</div>
      </div>
      <div class="card prod">
        <div class="icon">☀️</div>
        <div class="val">${s.production_kw != null ? s.production_kw.toFixed(2) + ' kW' : '–'}</div>
        <div class="lbl">Výroba</div>
      </div>
      <div class="card load">
        <div class="icon">🏠</div>
        <div class="val">${s.load_kw != null ? s.load_kw.toFixed(2) + ' kW' : '–'}</div>
        <div class="lbl">Spotřeba</div>
      </div>
    </div>
    <div class="status-row">
      <div class="card ${meter.cls}">
        <div class="icon">${meter.icon}</div>
        <div class="val" style="font-size:0.9rem">${meter.label}</div>
        <div class="lbl">Síť</div>
      </div>
      <div class="card price ${priceClass}">
        <div class="icon">💰</div>
        <div class="val">${currentPrice != null ? currentPrice.toFixed(4) + ' Kč' : '–'}</div>
        <div class="lbl">Spot / kWh</div>
      </div>
    </div>
  `;
}

function renderTable(section, currentHour) {
  if (!section || !section.hours || section.hours.length === 0) return '<p style="color:#64748b;font-size:0.8rem">Data nejsou k dispozici.</p>';

  const isToday = currentHour != null;
  let rows = '';

  for (const h of section.hours) {
    const isCurrent = isToday && h.hour === currentHour;
    const cheap = h.price != null && h.price < PRICE_THRESHOLD;
    const priceStr = h.price != null ? h.price.toFixed(4) : '–';
    const tempStr  = h.temperature != null ? Math.round(h.temperature) + '°C' : '–';
    const cloudStr = h.cloudcover != null ? `${cloudIcon(h.cloudcover)} ${h.cloudcover}%` : '–';

    rows += `
      <tr class="${isCurrent ? 'current-hour' : ''}">
        <td>${isCurrent ? '▶ ' : ''}${String(h.hour).padStart(2,'0')}:00</td>
        <td class="${cheap ? 'cheap' : ''}">${priceStr}</td>
        <td>${cloudStr}</td>
        <td>${tempStr}</td>
      </tr>`;
  }

  return `
    <table>
      <thead>
        <tr>
          <th>Hod</th>
          <th>Kč/kWh</th>
          <th>Počasí</th>
          <th>Teplota</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function loadData() {
  document.getElementById('refresh').textContent = '⏳';
  document.getElementById('error').style.display = 'none';

  try {
    const res = await fetch('data.json?t=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();

    const updatedDate = new Date(d.updated_at);
    document.getElementById('updated').textContent = 'Aktualizováno: ' + fmt(d.updated_at);

    const localHour = updatedDate.getHours();

    let html = '';
    html += renderCards(d.solar, d.current_price);

    if (d.today && d.today.hours && d.today.hours.length > 0) {
      const dateStr = new Date(d.today.date).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric', year: 'numeric' });
      html += `<div class="section-title">Dnes — ${dateStr}</div>`;
      html += renderTable(d.today, localHour);
    }

    if (d.tomorrow && d.tomorrow.hours && d.tomorrow.hours.length > 0) {
      const dateStr = new Date(d.tomorrow.date).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric', year: 'numeric' });
      html += `<div class="section-title">Zítra — ${dateStr}</div>`;
      html += renderTable(d.tomorrow, null);
    }

    document.getElementById('content').innerHTML = html;
    document.getElementById('content').style.fontSize = '';

    // Scroll na aktuální hodinu
    const currentRow = document.querySelector('tr.current-hour');
    if (currentRow) currentRow.scrollIntoView({ behavior: 'smooth', block: 'center' });

  } catch (e) {
    document.getElementById('error').style.display = 'block';
    document.getElementById('content').innerHTML = '';
  } finally {
    document.getElementById('refresh').textContent = '🔄 Obnovit';
  }
}

loadData();
</script>
</body>
</html>
